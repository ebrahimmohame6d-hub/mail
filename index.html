<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سلف الموظفين</title>
<style>
:root{
  --bg1:#0f172a; --bg2:#1e1b4b;
  --card:rgba(255,255,255,.07); --line:rgba(255,255,255,.12);
  --text:#f1f5f9; --muted:#94a3b8;
  --acc:#38bdf8; --acc2:#a78bfa; --ok:#34d399; --err:#f87171;
  --yel:#facc15;
}
*{box-sizing:border-box}
body{
  margin:0; font-family:Tahoma,Arial,sans-serif; color:var(--text); min-height:100vh;
  background:linear-gradient(-45deg,var(--bg1),var(--bg2),#0c4a6e,#312e81);
  background-size:400% 400%; animation:bgMove 18s ease infinite;
}
.hidden{display:none !important}
@keyframes bgMove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.9)}100%{opacity:1;transform:scale(1)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
@keyframes rowOut{to{opacity:0;transform:translateX(40px);height:0;padding-top:0;padding-bottom:0;margin:0}}
@keyframes toastIn{from{opacity:0;transform:translateY(-12px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(-10px)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(56,189,248,.5)}70%{box-shadow:0 0 0 14px rgba(56,189,248,0)}100%{box-shadow:0 0 0 0 rgba(56,189,248,0)}}
@keyframes ddDrop{from{opacity:0;transform:translateY(-10px) scale(.97)}to{opacity:1;transform:none}}
@keyframes ddItemIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(250,204,21,.35)}50%{box-shadow:0 0 0 6px rgba(250,204,21,0)}}

/* الهيدر */
.topbar{
  display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;
  padding:16px 24px; background:rgba(15,23,42,.6); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line); position:sticky; top:0; z-index:50;
  animation:fadeUp .5s ease both;
}
.brand{font-weight:bold; font-size:20px; background:linear-gradient(90deg,var(--acc),var(--acc2)); -webkit-background-clip:text; background-clip:text; color:transparent}
.tabs{display:flex; gap:6px; background:rgba(255,255,255,.05); padding:4px; border-radius:12px; flex-wrap:wrap}
.tab{
  border:0; background:transparent; color:var(--muted); padding:8px 16px; border-radius:9px;
  cursor:pointer; font-size:15px; transition:all .3s; font-family:inherit;
}
.tab.active{background:linear-gradient(90deg,var(--acc),var(--acc2)); color:#0f172a; font-weight:bold; box-shadow:0 4px 14px rgba(56,189,248,.35)}
.tab:not(.active):hover{color:var(--text); background:rgba(255,255,255,.06)}
.user-chip{display:flex; align-items:center; gap:12px}
.user-name{font-weight:bold; font-size:15px}
.role-tag{display:inline-block; margin-top:3px; font-size:12px; padding:2px 10px; border-radius:20px; background:rgba(56,189,248,.15); color:var(--acc)}
.logout{
  border:1px solid var(--line); background:rgba(248,113,113,.12); color:var(--err); padding:8px 14px;
  border-radius:10px; cursor:pointer; font-family:inherit; font-weight:bold; transition:transform .15s, background .2s;
}
.logout:hover{background:rgba(248,113,113,.25)}
.logout:active{transform:scale(.95)}
.refresh{
  border:1px solid var(--line); background:rgba(56,189,248,.12); color:var(--acc); width:38px; height:38px;
  border-radius:10px; cursor:pointer; font-size:17px; transition:transform .2s, background .2s;
}
.refresh:hover{background:rgba(56,189,248,.25)}
.refresh:active{transform:scale(.9)}
.refresh.busy{animation:spin .7s linear infinite}

/* شاشة الدخول */
#authScreen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px}
.auth-card{width:100%; max-width:380px; padding:28px 24px; animation:fadeUp .5s ease both}
.auth-brand{text-align:center; font-size:24px; margin-bottom:6px}
.auth-title{margin:0 0 6px; text-align:center; font-size:20px}
.auth-sub{text-align:center; color:var(--muted); margin:0 0 20px; font-size:14px}
.stack{display:flex; flex-direction:column; gap:14px}
.stack label, .form label{font-size:14px; color:var(--muted); display:block; margin-bottom:6px}

/* الصفحات */
main{max-width:980px; margin:24px auto; padding:0 16px}
.page{display:none}
.page.active{display:block; animation:fadeUp .45s ease both}

.card{
  background:var(--card); border:1px solid var(--line); border-radius:18px;
  padding:20px; margin-bottom:18px; backdrop-filter:blur(8px);
  box-shadow:0 10px 30px rgba(0,0,0,.25); animation:fadeUp .5s ease both;
  transition:transform .3s, box-shadow .3s;
}
.card:hover{transform:translateY(-2px); box-shadow:0 14px 36px rgba(0,0,0,.35)}
.card:has(.dd.open){position:relative; z-index:500}
.sec-title{margin:0 0 16px; font-size:19px}
.muted{color:var(--muted)}

.clock{text-align:center}
.clock #clockDay{font-size:18px; color:var(--acc)}
.clock #clockDate{color:var(--muted); margin-top:4px}
.big{font-size:42px; font-weight:bold; letter-spacing:2px; margin-top:6px; font-variant-numeric:tabular-nums}

/* الفورم */
.form{display:grid; grid-template-columns:1fr 1fr; gap:14px 16px}
.form .full{grid-column:1/-1}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:14px 16px}
input{
  width:100%; padding:11px 14px; border-radius:11px; border:1px solid var(--line);
  background:rgba(15,23,42,.6); color:var(--text); font-size:15px; outline:none; transition:all .25s; font-family:inherit;
}
input:focus{border-color:var(--acc); box-shadow:0 0 0 4px rgba(56,189,248,.15); transform:translateY(-1px)}
input[type=number]{-moz-appearance:textfield; appearance:textfield}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none; margin:0}
.primary{
  width:100%; padding:13px; border:0; border-radius:12px; cursor:pointer; font-size:16px; font-weight:bold; font-family:inherit;
  color:#0f172a; background:linear-gradient(90deg,var(--acc),var(--acc2)); transition:transform .15s, filter .3s;
}
.primary:hover{filter:brightness(1.1); animation:pulse 1.5s infinite}
.primary:active{transform:scale(.97)}
.primary:disabled{opacity:.6; cursor:wait}
.small{
  padding:11px 18px; border:0; border-radius:11px; cursor:pointer; font-weight:bold; white-space:nowrap; font-family:inherit;
  color:#0f172a; background:linear-gradient(90deg,var(--ok),var(--acc)); transition:transform .15s;
}
.small:hover{transform:translateY(-2px)}
.small:active{transform:scale(.95)}
.loading::after{
  content:""; display:inline-block; width:16px; height:16px; margin-right:8px; vertical-align:middle;
  border:2px solid #0f172a; border-top-color:transparent; border-radius:50%; animation:spin .7s linear infinite;
}

/* الدروب داون */
.dd{position:relative; z-index:5}
.dd.open{z-index:1000}
.dd-btn{
  width:100%; padding:11px 14px; border-radius:11px; border:1px solid var(--line);
  background:rgba(15,23,42,.6); color:var(--text); font-size:15px; font-family:inherit;
  display:flex; align-items:center; justify-content:space-between; cursor:pointer;
  transition:border-color .25s, box-shadow .25s, background .25s;
}
.dd-btn:hover{border-color:rgba(56,189,248,.5)}
.dd.open .dd-btn{border-color:var(--acc); box-shadow:0 0 0 4px rgba(56,189,248,.15)}
.dd-val{font-weight:bold}
.dd-val.ph{color:var(--muted); font-weight:normal}
.dd-arrow{
  width:26px; height:26px; border-radius:8px; display:grid; place-items:center;
  background:linear-gradient(135deg,var(--acc),var(--acc2)); color:#0f172a; font-size:12px;
  transition:transform .35s cubic-bezier(.34,1.56,.64,1);
}
.dd.open .dd-arrow{transform:rotate(180deg)}
.dd-menu{
  position:absolute; top:calc(100% + 8px); right:0; left:0; z-index:1001;
  background:#0f172a; border:1px solid var(--line); border-radius:14px; padding:6px;
  box-shadow:0 18px 40px rgba(0,0,0,.6);
  max-height:0; overflow:hidden; opacity:0; transform:translateY(-8px) scale(.97); transform-origin:top;
  pointer-events:none; transition:max-height .35s ease, opacity .25s ease, transform .3s ease;
}
.dd.open .dd-menu{
  max-height:280px; overflow-y:auto; opacity:1; transform:none; pointer-events:auto;
  animation:ddDrop .3s ease both;
}
.dd-item{
  padding:10px 14px; border-radius:10px; cursor:pointer; color:var(--text); font-weight:bold;
  transition:background .2s, color .2s, padding-right .2s; opacity:0;
}
.dd.open .dd-item{animation:ddItemIn .35s ease both; animation-delay:calc(var(--i) * 45ms)}
.dd-item:hover{background:rgba(56,189,248,.14); padding-right:18px}
.dd-item.sel{background:linear-gradient(90deg,var(--acc),var(--acc2)); color:#0f172a}
.dd-menu::-webkit-scrollbar{width:6px}
.dd-menu::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2); border-radius:6px}

/* الصفوف */
.card-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:8px}
.card-head h3{margin:0; font-size:19px}
.card-head b{color:var(--ok); font-size:18px}

.ln{
  display:grid; grid-template-columns:1fr auto; gap:6px 12px; align-items:center;
  padding:12px 14px; border-radius:12px; margin-bottom:10px;
  background:rgba(255,255,255,.04); border:1px solid var(--line);
  animation:slideIn .4s ease both; transition:transform .25s, box-shadow .25s, background .25s;
}
.ln:hover{transform:translateX(-3px)}
.ln.pend{
  background:rgba(250,204,21,.16); border-color:rgba(250,204,21,.75);
  box-shadow:0 0 18px rgba(250,204,21,.18); animation:slideIn .4s ease both, glow 2.4s ease-in-out infinite;
}
.ln.done{background:rgba(52,211,153,.16); border-color:rgba(52,211,153,.75)}
.ln.rej{background:rgba(248,113,113,.16); border-color:rgba(248,113,113,.75)}
.ln.removing{animation:rowOut .35s ease forwards}
.ln-main{font-size:15px}
.ln-amt{font-variant-numeric:tabular-nums; color:var(--text)}
.ln-notes{color:var(--muted); font-size:14px}
.ln-actions{display:flex; align-items:center; gap:8px; justify-content:flex-end; flex-wrap:wrap}
.ln-meta{grid-column:1/-1; color:var(--muted); font-size:13px}
.badge{font-size:12px; padding:3px 10px; border-radius:20px; font-weight:bold; animation:pop .4s ease both}
.badge.pend{background:var(--yel); color:#422006}
.badge.done{background:var(--ok); color:#052e16}
.badge.rej{background:var(--err); color:#450a0a}

.trash{
  border:0; background:rgba(248,113,113,.12); color:var(--err); width:38px; height:38px;
  border-radius:10px; cursor:pointer; font-size:17px; transition:background .2s, transform .2s;
}
.trash:hover{background:rgba(248,113,113,.28); animation:shake .5s ease}
.trash:active{transform:scale(.9)}

.done-btn, .rej-btn{
  border:0; padding:8px 14px; border-radius:10px; cursor:pointer; font-family:inherit; font-weight:bold;
  transition:transform .15s, filter .2s;
}
.done-btn{color:#052e16; background:linear-gradient(90deg,var(--ok),var(--acc))}
.rej-btn{color:#450a0a; background:linear-gradient(90deg,var(--err),#fb923c)}
.done-btn:hover, .rej-btn:hover{transform:translateY(-2px); filter:brightness(1.08)}
.done-btn:active, .rej-btn:active{transform:scale(.95)}
.done-btn:disabled, .rej-btn:disabled{opacity:.5; cursor:wait}

.empty{text-align:center; color:var(--muted); padding:30px 10px; animation:pop .5s ease both}

/* جدول اليوزرات (نفس شكل جدول الشهر) */
.utable{display:flex; flex-direction:column}
.urow{
  display:grid; grid-template-columns:1.2fr 1.2fr 1fr .8fr auto; gap:10px; align-items:center;
  padding:12px 14px; border-radius:12px; margin-bottom:8px;
  background:rgba(255,255,255,.04); border:1px solid var(--line);
  animation:slideIn .4s ease both; transition:background .25s, border-color .25s, transform .25s;
}
.urow:hover{background:rgba(56,189,248,.08); border-color:rgba(56,189,248,.25); transform:translateX(-3px)}
.urow.removing{animation:rowOut .35s ease forwards}
.urow.uhead, .loan-head{
  background:rgba(56,189,248,.15); border:1px solid rgba(56,189,248,.35);
  font-weight:bold; color:var(--acc); animation:none;
}
.urow.uhead:hover{transform:none; background:rgba(56,189,248,.15)}
.urow .pw{font-variant-numeric:tabular-nums; color:var(--muted)}
.urow .lbl{display:none}

/* التفاصيل */
.picker{display:flex; gap:12px; align-items:center; margin-bottom:18px; flex-wrap:wrap}
.picker .dd{max-width:320px; width:100%}
.grand{text-align:center; background:linear-gradient(135deg,rgba(56,189,248,.18),rgba(167,139,250,.18))}
.grand .big{color:var(--ok)}
.pend-sum{color:var(--yel); font-weight:bold; margin-top:6px}
.mh{display:flex; justify-content:space-between; font-weight:bold; font-size:18px; margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid var(--line)}
.mh .mt{color:var(--acc)}
.spinner{
  width:42px; height:42px; margin:30px auto; border-radius:50%;
  border:4px solid rgba(255,255,255,.15); border-top-color:var(--acc); animation:spin .9s linear infinite;
}

.toggle-form{width:100%; margin-bottom:14px}

/* صفحة الأسماء */
.name-row{
  display:flex; justify-content:space-between; align-items:center; gap:10px;
  padding:12px 14px; border-radius:12px; margin-bottom:8px;
  background:rgba(255,255,255,.04); border:1px solid transparent;
  animation:slideIn .4s ease both; transition:background .25s, border-color .25s, transform .25s;
}
.name-row:hover{background:rgba(56,189,248,.08); border-color:rgba(56,189,248,.25); transform:translateX(-3px)}
.name-row.removing{animation:rowOut .35s ease forwards}
.nr-name{font-weight:bold; font-size:16px}

/* التوست */
#toasts{position:fixed; top:90px; left:50%; transform:translateX(-50%); z-index:99; display:flex; flex-direction:column; gap:8px; align-items:center}
.toast{
  padding:12px 20px; border-radius:12px; background:rgba(15,23,42,.92); border:1px solid var(--line);
  box-shadow:0 10px 30px rgba(0,0,0,.4); animation:toastIn .35s ease both; min-width:200px; text-align:center;
}
.toast.ok{border-color:rgba(52,211,153,.5)}
.toast.err{border-color:rgba(248,113,113,.6)}
.toast.hide{animation:toastOut .4s ease forwards}

/* موبايل */
@media (max-width:700px){
  .form, .row2{grid-template-columns:1fr}
  .big{font-size:32px}
  .topbar{padding:12px 16px}
  .urow.uhead{display:none}
  .urow{grid-template-columns:1fr 1fr; gap:8px 12px}
  .urow .lbl{display:block; font-size:12px; color:var(--muted); margin-bottom:2px}
  .urow .trash{grid-column:1/-1; width:100%; height:40px}
  .urow > div:not(.trash-cell){min-width:0; overflow-wrap:anywhere}
}
</style>
</head>
<body>

<!-- شاشة الدخول -->
<div id="authScreen">
  <div class="card auth-card">
    <div class="brand auth-brand">💰 سلف الموظفين</div>
    <h2 class="auth-title">تسجيل الدخول</h2>
    <p class="auth-sub">ادخل برقم موبايلك والباسورد</p>

    <form class="stack form-slide" onsubmit="doLogin(event)">
      <div>
        <label>رقم الموبايل (اليوزر)</label>
        <input id="lgPhone" type="tel" inputmode="numeric" maxlength="11" autocomplete="username" required>
      </div>
      <div>
        <label>الباسورد</label>
        <input id="lgPass" type="password" autocomplete="current-password" required>
      </div>
      <button id="lgBtn" class="primary" type="submit">دخول</button>
    </form>
  </div>
</div>

<!-- التطبيق بعد الدخول -->
<div id="appScreen" class="hidden">
  <header class="topbar">
    <div class="brand">💰 سلف الموظفين</div>
    <div class="tabs">
      <button class="tab admin-only active" data-tab="main" onclick="showTab('main')">تسجيل السلف</button>
      <button class="tab admin-only" data-tab="details" onclick="showTab('details')">التفاصيل</button>
      <button class="tab admin-only" data-tab="requests" onclick="showTab('requests')">الطلبات</button>
      <button class="tab admin-only" data-tab="users" onclick="showTab('users')">اليوزرات</button>
      <button class="tab admin-only" data-tab="names" onclick="showTab('names')">الأسماء</button>
      <button class="tab emp-only" data-tab="me" onclick="showTab('me')">سلفي</button>
    </div>
    <div class="user-chip">
      <button class="refresh" id="refreshBtn" title="تحديث" onclick="refreshNow()">🔄</button>
      <div>
        <div class="user-name" id="userName"></div>
        <span class="role-tag" id="userRole"></span>
      </div>
      <button class="logout" onclick="logout()">خروج</button>
    </div>
  </header>

  <div id="toasts"></div>

  <main>
    <!-- الأدمن: تسجيل السلف -->
    <section class="page active admin-only" id="page-main">
      <div class="card clock">
        <div id="clockDay"></div>
        <div id="clockDate"></div>
        <div id="clockTime" class="big"></div>
      </div>

      <form class="card form" onsubmit="submitLoan(event)">
        <div>
          <label>الاسم</label>
          <div class="dd" id="loanDD"></div>
        </div>
        <div>
          <label>رقم السلفة</label>
          <input id="loanAmount" type="number" min="1" step="any">
        </div>
        <div class="full">
          <label>الملاحظات</label>
          <input id="loanNotes" placeholder="اختياري" autocomplete="off">
        </div>
        <div class="full">
          <button id="saveBtn" class="primary" type="submit">سجّل السلفة</button>
        </div>
      </form>

      <div class="card">
        <div class="card-head">
          <h3 id="monthTitle">...</h3>
          <span>الإجمالي: <b id="monthTotal">0</b></span>
        </div>
        <div id="loanList"></div>
      </div>
    </section>

    <!-- الأدمن: التفاصيل -->
    <section class="page admin-only" id="page-details">
      <div class="card picker">
        <label class="muted">اختار الاسم:</label>
        <div class="dd" id="detailDD"></div>
      </div>
      <div id="detailResult"></div>
    </section>

    <!-- الأدمن: الطلبات -->
    <section class="page admin-only" id="page-requests">
      <div class="card">
        <h3 class="sec-title">طلبات السلف</h3>
        <div id="requestsList"></div>
      </div>
    </section>

    <!-- الأدمن: اليوزرات (إضافة + جدول + مسح) -->
    <section class="page admin-only" id="page-users">
      <div class="card">
        <h3 class="sec-title">إضافة يوزر جديد</h3>
        <form class="stack" onsubmit="submitUser(event)">
          <div class="row2">
            <div>
              <label>الاسم</label>
              <input id="nuName" required autocomplete="off">
            </div>
            <div>
              <label>رقم الموبايل (اليوزر)</label>
              <input id="nuPhone" type="tel" inputmode="numeric" maxlength="11" required autocomplete="off">
            </div>
          </div>
          <div>
            <label>الباسورد</label>
            <input id="nuPass" required autocomplete="off">
          </div>
          <button id="nuBtn" class="primary" type="submit">＋ إضافة اليوزر</button>
        </form>
      </div>

      <div class="card">
        <h3 class="sec-title">كل اليوزرات</h3>
        <div class="utable" id="usersList"></div>
      </div>
    </section>

    <!-- الأدمن: الأسماء -->
    <section class="page admin-only" id="page-names">
      <div class="card">
        <h3 class="sec-title">كل الأسماء</h3>
        <div id="namesList"></div>
      </div>
    </section>

    <!-- الموظف: سلفي -->
    <section class="page emp-only" id="page-me">
      <button class="small toggle-form" onclick="toggleMyForm()">＋ إضافة سلفة</button>

      <div class="card hidden" id="myForm">
        <h3 class="sec-title">طلب سلفة</h3>
        <form class="stack" onsubmit="submitMyLoan(event)">
          <div>
            <label>المبلغ</label>
            <input id="myAmount" type="number" min="1" step="any" required>
          </div>
          <div class="row2">
            <div>
              <label>رقم تليفونك</label>
              <input id="myPhone" type="tel" inputmode="numeric" required>
            </div>
            <div>
              <label>طريقة الاستلام</label>
              <div class="dd" id="myMethodDD"></div>
            </div>
          </div>
          <button id="myBtn" class="primary" type="submit">إرسال الطلب</button>
        </form>
      </div>

      <div id="myResult"></div>
    </section>
  </main>
</div>

<script>
/* ⬇️ حط هنا رابط الـ Web app بتاعك (/exec) */
const API_URL = 'https://script.google.com/macros/s/AKfycbyVryYDMSeSo7vvJNOyamVjRut5-A84WMhYa8J5s-UpVrsOM-eh4WE9Vw95H1yJYdDWMQ/exec';

const SESSION_KEY = 'salfSession';
const DAYS = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const PAY_METHODS = ['نقدي','انستا باي','فودافون كاش'];
const ST_PEND = 'معلقة';
const ST_DONE = 'تم';
const ST_REJ = 'مرفوض';

let names = [];
let currentMonth = '';
let curTab = 'main';
const cache = {};

/* ----- أدوات ----- */
function $(id){ return document.getElementById(id); }
function pad(n){ return String(n).padStart(2,'0'); }
function fmt(n){ return Number(n).toLocaleString('en-US'); }
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function setBusy(btn, on){ btn.disabled = on; btn.classList.toggle('loading', on); }

function toast(msg, type){
  const t = document.createElement('div');
  t.className = 'toast ' + (type || '');
  t.textContent = msg;
  $('toasts').appendChild(t);
  setTimeout(() => t.classList.add('hide'), 2600);
  setTimeout(() => t.remove(), 3000);
}
function showErr(err){
  toast((err && err.message) ? err.message : 'حصل خطأ', 'err');
}

function countUp(el, target){
  if (!el) return;
  const start = performance.now(), dur = 900;
  function step(t){
    const p = Math.min((t - start) / dur, 1);
    el.textContent = fmt(Math.round(target * (1 - Math.pow(1 - p, 3))));
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function tick(){
  const d = new Date();
  $('clockDay').textContent = DAYS[d.getDay()];
  $('clockDate').textContent = pad(d.getDate()) + '/' + pad(d.getMonth()+1) + '/' + d.getFullYear();
  $('clockTime').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}

/* ----- الجلسة ----- */
function getSession(){
  try { return JSON.parse(localStorage.getItem(SESSION_KEY)); } catch(e){ return null; }
}
function saveSession(s){ localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }
function logout(){
  localStorage.removeItem(SESSION_KEY);
  location.reload();
}

/* ----- الاتصال بالـ Apps Script ----- */
function api(action, params = {}, creds = null){
  const s = creds || getSession();
  const q = new URLSearchParams({ action, ...params });
  if (s) { q.set('u', s.u); q.set('p', s.p); }
  return fetch(API_URL + '?' + q.toString())
    .then(r => r.json())
    .then(j => {
      if (!j.ok) throw new Error(j.error);
      return j.data;
    });
}

/* تحميل صفحة مع مقارنة: بيرسم بس لو البيانات اتغيرت (إلا لو force) */
function fetchView(key, action, params, render, force){
  return api(action, params).then(data => {
    const s = JSON.stringify(data);
    if (!force && cache[key] === s) return;
    cache[key] = s;
    render(data);
  });
}

/* ----- الدروب داون ----- */
const dds = {};
function initDD(id, placeholder, onPick){
  const el = $(id);
  el.innerHTML = `
    <button type="button" class="dd-btn"><span class="dd-val ph">${esc(placeholder)}</span><span class="dd-arrow">▼</span></button>
    <div class="dd-menu"></div>`;
  dds[id] = { value: '', placeholder, onPick, el };
  el.querySelector('.dd-btn').onclick = e => {
    e.stopPropagation();
    document.querySelectorAll('.dd.open').forEach(d => { if (d !== el) d.classList.remove('open'); });
    el.classList.toggle('open');
  };
}
function ddSetItems(id, items){
  const st = dds[id];
  if (!st) return;
  if (!items.includes(st.value)) st.value = '';
  const val = st.el.querySelector('.dd-val');
  const menu = st.el.querySelector('.dd-menu');
  val.textContent = st.value || st.placeholder;
  val.classList.toggle('ph', !st.value);
  menu.innerHTML = items.map((n, i) =>
    `<div class="dd-item${n === st.value ? ' sel' : ''}" style="--i:${i}" data-value="${esc(n)}">${esc(n)}</div>`
  ).join('');
  menu.querySelectorAll('.dd-item').forEach(it => {
    it.onclick = e => {
      e.stopPropagation();
      st.value = it.dataset.value;
      st.el.classList.remove('open');
      ddSetItems(id, items);
      if (st.onPick) st.onPick(st.value);
    };
  });
}
function ddGet(id){ return dds[id] ? dds[id].value : ''; }
function ddReset(id){ if (dds[id]) dds[id].value = ''; }

document.addEventListener('click', () => {
  document.querySelectorAll('.dd.open').forEach(d => d.classList.remove('open'));
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.querySelectorAll('.dd.open').forEach(d => d.classList.remove('open'));
});

/* ----- الدخول ----- */
function doLogin(e){
  e.preventDefault();
  const u = $('lgPhone').value.trim(), p = $('lgPass').value;
  if (!/^\d{11}$/.test(u)) return toast('لازم رقم الموبايل يكون 11 رقم بس', 'err');
  const btn = $('lgBtn');
  setBusy(btn, true);
  api('login', {}, { u, p })
    .then(user => {
      saveSession({ u, p, name: user.name, role: user.role });
      enterApp();
    })
    .catch(showErr)
    .finally(() => setBusy(btn, false));
}

function enterApp(){
  const s = getSession();
  const isAdmin = s.role === 'admin';
  $('authScreen').classList.add('hidden');
  $('appScreen').classList.remove('hidden');
  $('userName').textContent = s.name;
  $('userRole').textContent = isAdmin ? 'أدمن' : 'موظف';
  document.querySelectorAll('.admin-only').forEach(el => el.classList.toggle('hidden', !isAdmin));
  document.querySelectorAll('.emp-only').forEach(el => el.classList.toggle('hidden', isAdmin));
  if (isAdmin){
    loadNames(true);
    showTab('main');
  } else {
    ddSetItems('myMethodDD', PAY_METHODS);
    showTab('me');
  }
}

/* ----- الصفحات والتحديث ----- */
function showTab(name){
  curTab = name;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === 'page-' + name));
  loadCurrent(false);
}

function loadCurrent(force){
  const s = getSession();
  if (!s) return Promise.resolve();
  switch (curTab){
    case 'main':     return fetchView('month', 'month', {}, renderMonth, force);
    case 'details': {
      const n = ddGet('detailDD');
      if (!n){ $('detailResult').innerHTML = '<div class="empty">اختار اسم عشان تشوف التفاصيل</div>'; return Promise.resolve(); }
      return fetchView('d:' + n, 'details', { name: n },
        d => renderBlock($('detailResult'), d, `مفيش سلف مسجلة لـ ${esc(d.name)}`), force);
    }
    case 'requests': return fetchView('requests', 'requests', {}, renderRequests, force);
    case 'users':    return fetchView('users', 'users', {}, renderUsers, force);
    case 'names':    return loadNames(force);
    case 'me':       return fetchView('me', 'myDetails', {},
                       d => renderBlock($('myResult'), d, 'مفيش سلف مسجلة ليك لسه 🌙'), force);
  }
  return Promise.resolve();
}

function refreshNow(){
  const b = $('refreshBtn');
  b.classList.add('busy');
  Promise.resolve()
    .then(() => loadCurrent(true))
    .catch(showErr)
    .finally(() => b.classList.remove('busy'));
}

/* تحديث تلقائي كل 8 ثواني */
setInterval(() => {
  const s = getSession();
  if (!s || document.hidden || $('appScreen').classList.contains('hidden')) return;
  loadCurrent(false).catch(() => {});
  if (s.role === 'admin' && curTab !== 'names') loadNames(false).catch(() => {});
}, 8000);

/* ----- بلوكات السلف (مشتركة) ----- */
function loanRowHTML(r, i, opts = {}){
  const st = r.status || '';
  const cls = st === ST_PEND ? 'pend' : st === ST_DONE ? 'done' : st === ST_REJ ? 'rej' : '';
  const badge = st === ST_PEND ? '<span class="badge pend">معلقة</span>'
              : st === ST_DONE ? '<span class="badge done">تم ✅</span>'
              : st === ST_REJ ? '<span class="badge rej">مرفوض ✖</span>' : '';
  const name = opts.showName ? `<b>${esc(r.name)}</b> · ` : '';
  const notes = r.notes ? ` <span class="ln-notes">· ${esc(r.notes)}</span>` : '';
  const meta = [`${esc(r.day)} ${esc(r.date)} · ${esc(r.time)}`];
  if (r.method) meta.push(esc(r.method));
  if (r.phone) meta.push('📞 ' + esc(r.phone));
  return `
    <div class="ln ${cls}" style="animation-delay:${i * 50}ms">
      <div class="ln-main">${name}<b class="ln-amt">${fmt(r.amount)}</b>${notes}</div>
      <div class="ln-actions">${badge}${opts.actions || ''}</div>
      <div class="ln-meta">${meta.join(' · ')}</div>
    </div>`;
}

function grandHTML(d){
  const pend = d.months.reduce((s, m) =>
    s + m.rows.filter(r => r.status === ST_PEND).reduce((a, r) => a + r.amount, 0), 0);
  return `
    <div class="card grand">
      <div class="muted">إجمالي سلف ${esc(d.name)}</div>
      <div class="big">0</div>
      ${pend ? `<div class="pend-sum">معلق: ${fmt(pend)}</div>` : ''}
    </div>`;
}

function monthCardHTML(m, i){
  return `
    <div class="card" style="animation-delay:${i * 120}ms">
      <div class="mh"><span>${esc(m.month)}</span><span class="mt">${fmt(m.total)}</span></div>
      ${m.rows.map((r, j) => loanRowHTML(r, j)).join('')}
    </div>`;
}

function renderBlock(box, d, emptyMsg){
  if (!d.months.length){
    box.innerHTML = `<div class="empty">${emptyMsg}</div>`;
    return;
  }
  box.innerHTML = grandHTML(d) + d.months.map(monthCardHTML).join('');
  countUp(box.querySelector('.grand .big'), d.grandTotal);
}

/* ----- الموظف ----- */
function toggleMyForm(){
  const f = $('myForm');
  const willShow = f.classList.contains('hidden');
  f.classList.toggle('hidden', !willShow);
  if (willShow){ f.classList.remove('form-slide'); void f.offsetWidth; f.classList.add('form-slide'); }
}

function submitMyLoan(e){
  e.preventDefault();
  const amount = $('myAmount').value;
  const phone = $('myPhone').value.trim();
  const method = ddGet('myMethodDD');
  if (!amount || Number(amount) <= 0) return toast('اكتب مبلغ صحيح', 'err');
  if (!phone) return toast('اكتب رقم تليفونك', 'err');
  if (!method) return toast('اختار طريقة الاستلام', 'err');

  const btn = $('myBtn');
  setBusy(btn, true);
  api('requestLoan', { amount, phone, method })
    .then(() => {
      $('myAmount').value = '';
      $('myPhone').value = '';
      ddReset('myMethodDD');
      ddSetItems('myMethodDD', PAY_METHODS);
      toast('اتبعتت السلفة ✅ مستنية الأدمن', 'ok');
      $('myForm').classList.add('hidden');
      loadCurrent(true);
    })
    .catch(showErr)
    .finally(() => setBusy(btn, false));
}

/* ----- الأدمن: الأسماء ----- */
function loadNames(force){
  return fetchView('names', 'names', {}, setNames, force);
}

function setNames(list){
  names = list;
  ddSetItems('loanDD', names);
  ddSetItems('detailDD', names);
  renderNamesList();
}

function renderNamesList(){
  const box = $('namesList');
  if (!names.length){
    box.innerHTML = '<div class="empty">مفيش أسماء لسه</div>';
    return;
  }
  box.innerHTML = names.map((n, i) => `
    <div class="name-row" style="animation-delay:${i * 50}ms">
      <span class="nr-name">${esc(n)}</span>
      <button class="trash" data-name="${esc(n)}" title="امسح">🗑️</button>
    </div>`).join('');
  box.querySelectorAll('.trash').forEach(b => {
    b.onclick = () => removeName(b.dataset.name, b.closest('.name-row'));
  });
}

function removeName(name, rowEl){
  if (!confirm('متأكد إنك عايز تمسح "' + name + '" من الأسماء؟')) return;
  rowEl.classList.add('removing');
  api('deleteName', { name })
    .then(list => {
      setTimeout(() => {
        cache['names'] = JSON.stringify(list);
        setNames(list);
        toast('اتمسح الاسم 🗑️');
      }, 300);
    })
    .catch(err => {
      rowEl.classList.remove('removing');
      showErr(err);
    });
}

/* ----- الأدمن: تسجيل السلف ----- */
function renderMonth(data){
  currentMonth = data.month;
  $('monthTitle').textContent = data.month;
  const rows = data.rows;
  countUp($('monthTotal'), rows.filter(r => r.status !== ST_REJ).reduce((s, r) => s + r.amount, 0));
  const box = $('loanList');
  if (!rows.length){
    box.innerHTML = '<div class="empty">مفيش سلف في الشهر ده لسه 🌙</div>';
    return;
  }
  box.innerHTML = rows.slice().reverse().map((r, i) => loanRowHTML(r, i, {
    showName: true,
    actions: `<button class="trash" title="امسح" onclick="removeLoan(${r.row}, this)">🗑️</button>`
  })).join('');
}

function submitLoan(e){
  e.preventDefault();
  const name = ddGet('loanDD');
  const amount = $('loanAmount').value;
  const notes = $('loanNotes').value;
  if (!name){ toast('اختار الاسم الأول', 'err'); return; }
  if (!amount || Number(amount) <= 0){ toast('اكتب مبلغ صحيح', 'err'); return; }

  const btn = $('saveBtn');
  setBusy(btn, true);
  api('add', { name, amount, notes })
    .then(() => {
      $('loanAmount').value = '';
      $('loanNotes').value = '';
      toast('اتسجلت السلفة ✅', 'ok');
      loadCurrent(true);
    })
    .catch(showErr)
    .finally(() => setBusy(btn, false));
}

function removeLoan(row, btn){
  if (!confirm('متأكد إنك عايز تمسح السلفة دي؟')) return;
  const rowEl = btn.closest('.ln');
  rowEl.classList.add('removing');
  api('delete', { month: currentMonth, row })
    .then(() => { toast('اتمسحت 🗑️'); loadCurrent(true); })
    .catch(err => { rowEl.classList.remove('removing'); showErr(err); });
}

/* ----- الأدمن: الطلبات (موافقة / رفض) ----- */
function renderRequests(rows){
  const box = $('requestsList');
  if (!rows.length){
    box.innerHTML = '<div class="empty">مفيش طلبات لسه</div>';
    return;
  }
  box.innerHTML = rows.map((r, i) => {
    const acts = r.status === ST_PEND
      ? `<button class="done-btn" data-act="done" data-m="${esc(r.month)}" data-r="${r.row}">موافقة ✓</button>` +
        `<button class="rej-btn" data-act="reject" data-m="${esc(r.month)}" data-r="${r.row}">رفض ✖</button>`
      : '';
    return loanRowHTML(r, i, { showName: true, actions: acts });
  }).join('');
  box.querySelectorAll('[data-act]').forEach(b => {
    b.onclick = () => setStatus(b.dataset.m, Number(b.dataset.r), b.dataset.act, b);
  });
}

function setStatus(month, row, act, btn){
  btn.closest('.ln-actions').querySelectorAll('button').forEach(x => x.disabled = true);
  api('setStatus', { month, row, s: act })
    .then(() => {
      toast(act === 'done' ? 'اتوافق على السلفة ✅' : 'اترفضت السلفة ✖', act === 'done' ? 'ok' : 'err');
      loadCurrent(true);
    })
    .catch(err => {
      btn.closest('.ln-actions').querySelectorAll('button').forEach(x => x.disabled = false);
      showErr(err);
    });
}

/* ----- الأدمن: اليوزرات (إضافة + جدول + مسح) ----- */
function submitUser(e){
  e.preventDefault();
  const name = $('nuName').value.trim();
  const phone = $('nuPhone').value.trim();
  const pass = $('nuPass').value;
  if (!/^\d{11}$/.test(phone)) return toast('لازم رقم الموبايل يكون 11 رقم بس', 'err');
  if (pass.length < 4) return toast('الباسورد لازم يكون 4 حروف على الأقل', 'err');
  const btn = $('nuBtn');
  setBusy(btn, true);
  api('addUser', { name, phone, pass })
    .then(list => {
      $('nuName').value = '';
      $('nuPhone').value = '';
      $('nuPass').value = '';
      toast('اتضاف اليوزر ✅', 'ok');
      cache['users'] = JSON.stringify(list);
      renderUsers(list);
      loadNames(true);
    })
    .catch(showErr)
    .finally(() => setBusy(btn, false));
}

function renderUsers(list){
  const box = $('usersList');
  if (!list.length){
    box.innerHTML = '<div class="empty">مفيش يوزرات لسه</div>';
    return;
  }
  box.innerHTML = `
    <div class="urow uhead">
      <div>الاسم</div><div>اليوزر (الموبايل)</div><div>الباسورد</div><div>الدور</div><div></div>
    </div>` +
    list.map((u, i) => {
      const del = u.role === 'admin'
        ? '<div></div>'
        : `<button class="trash" title="امسح" data-phone="${esc(u.username)}">🗑️</button>`;
      return `
      <div class="urow" style="animation-delay:${i * 50}ms" data-u="${esc(u.username)}">
        <div><span class="lbl">الاسم</span><b>${esc(u.name)}</b></div>
        <div><span class="lbl">اليوزر</span>${esc(u.username)}</div>
        <div><span class="lbl">الباسورد</span><span class="pw">${esc(u.password)}</span></div>
        <div><span class="lbl">الدور</span><span class="role-tag">${u.role === 'admin' ? 'أدمن' : 'موظف'}</span></div>
        ${del}
      </div>`;
    }).join('');

  box.querySelectorAll('.trash[data-phone]').forEach(b => {
    b.onclick = () => removeUser(b.dataset.phone, b.closest('.urow'));
  });
}

function removeUser(phone, rowEl){
  if (!confirm('متأكد إنك عايز تمسح اليوزر ده؟')) return;
  rowEl.classList.add('removing');
  api('deleteUser', { phone })
    .then(list => {
      setTimeout(() => {
        cache['users'] = JSON.stringify(list);
        renderUsers(list);
        toast('اتمسح اليوزر 🗑️');
      }, 300);
    })
    .catch(err => {
      rowEl.classList.remove('removing');
      showErr(err);
    });
}

/* ----- الأدمن: التفاصيل ----- */
function loadDetails(){
  const n = ddGet('detailDD');
  const box = $('detailResult');
  if (!n){
    box.innerHTML = '<div class="empty">اختار اسم عشان تشوف التفاصيل</div>';
    return;
  }
  box.innerHTML = '<div class="spinner"></div>';
  fetchView('d:' + n, 'details', { name: n },
    d => renderBlock(box, d, `مفيش سلف مسجلة لـ ${esc(d.name)}`), true)
    .catch(showErr);
}

/* ----- تشغيل ----- */
initDD('loanDD', 'اختار الاسم', null);
initDD('detailDD', 'اختار الاسم', () => loadDetails());
initDD('myMethodDD', 'اختار طريقة الاستلام', null);
tick();
setInterval(tick, 1000);

if (getSession()) enterApp();
</script>
</body>
</html>
